[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunbid"
version = "0.2.0"
description = "Daemon de sincronização P2P do SunBi"
requires-python = ">=3.10"
dependencies = ["zeroconf>=0.120"]

[project.scripts]
sunbid = "sunbid:main"

[tool.setuptools]
py-modules = ["sunbid"]
