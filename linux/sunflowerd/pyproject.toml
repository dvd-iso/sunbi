[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunflowerd"
version = "0.1.0"
description = "Daemon de sincronização P2P do Sunflower Clocks"
requires-python = ">=3.10"
dependencies = ["zeroconf>=0.120"]

[project.scripts]
sunflowerd = "sunflowerd:main"

[tool.setuptools]
py-modules = ["sunflowerd"]
