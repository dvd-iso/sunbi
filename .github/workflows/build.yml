name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"
      - name: Testes (lógica e telas)
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunbi-telas
          path: android/app/build/shots/*.png
          if-no-files-found: ignore
      - name: Chave de assinatura (secrets)
        env:
          KEYSTORE_B64: ${{ secrets.SUNBI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sunbi.jks"
            echo "SUNBI_KEYSTORE=$RUNNER_TEMP/sunbi.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Release sem SUNBI_KEYSTORE_BASE64: não publico APK assinado com a chave pública de desenvolvimento."
            exit 1
          else
            echo "::warning::Sem chave privada: APK de teste assinado com a chave de desenvolvimento."
          fi
      - name: Build APK
        working-directory: android
        env:
          SUNBI_KEYSTORE_PASSWORD: ${{ secrets.SUNBI_KEYSTORE_PASSWORD }}
          SUNBI_KEY_ALIAS: ${{ secrets.SUNBI_KEY_ALIAS }}
          SUNBI_KEY_PASSWORD: ${{ secrets.SUNBI_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/sunbi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sunbi-apk
          path: dist/sunbi.apk
      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sunbi.apk

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes do módulo de dados
        run: node --test extension/tests/store.test.mjs
      - name: Validar manifesto e arquivos
        run: |
          node --check extension/background.js
          node --check extension/popup.js
          node -e '
            const fs = require("fs"), m = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
            const files = [m.background.service_worker, m.action.default_popup, ...Object.values(m.icons)];
            for (const f of files) if (!fs.existsSync("extension/" + f)) throw new Error("falta " + f);
            console.log("extensão ok:", m.name, m.version);
          '
      - name: Empacotar
        run: |
          mkdir -p dist
          cd extension && zip -qr ../dist/sunbi-extensao.zip . -x "tests/*" "package.json" "README.md"
      - uses: actions/upload-artifact@v4
        with:
          name: sunbi-extensao
          path: dist/sunbi-extensao.zip
      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sunbi-extensao.zip
