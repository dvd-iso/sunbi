name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"
      - name: Testes (lógica e telas)
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunbi-telas
          path: android/app/build/shots/*.png
          if-no-files-found: ignore
      - name: Chave de assinatura (secrets)
        env:
          KEYSTORE_B64: ${{ secrets.SUNBI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sunbi.jks"
            echo "SUNBI_KEYSTORE=$RUNNER_TEMP/sunbi.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Release sem SUNBI_KEYSTORE_BASE64: não publico APK assinado com a chave pública de desenvolvimento."
            exit 1
          else
            echo "::warning::Sem chave privada: APK de teste assinado com a chave de desenvolvimento."
          fi
      - name: Build APK
        working-directory: android
        env:
          SUNBI_KEYSTORE_PASSWORD: ${{ secrets.SUNBI_KEYSTORE_PASSWORD }}
          SUNBI_KEY_ALIAS: ${{ secrets.SUNBI_KEY_ALIAS }}
          SUNBI_KEY_PASSWORD: ${{ secrets.SUNBI_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/sunbi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sunbi-apk
          path: dist/sunbi.apk
      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sunbi.apk

  noctalia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar manifesto e traduções
        run: |
          python3 - <<'PY'
          import json, pathlib, tomllib
          d = pathlib.Path("noctalia/sunbi")
          m = tomllib.loads((d / "plugin.toml").read_text())
          for kind in ("widget", "panel", "service"):
              for e in m.get(kind, []):
                  assert (d / e["entry"]).exists(), e["entry"]
          keys = None
          for f in (d / "translations").glob("*.json"):
              t = json.loads(f.read_text())
              k = set(t["ui"]) | {f"settings.{s}" for s in t["settings"]}
              assert keys is None or k == keys, f"chaves diferentes em {f.name}"
              keys = k
          print("plugin ok:", m["id"], m["version"])
          PY
      - name: Luau (compilar e testar o módulo de dados)
        working-directory: noctalia/sunbi
        run: |
          curl -sL -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -q -o /tmp/luau.zip -d /tmp/luau
          for f in *.luau lib/*.luau; do /tmp/luau/luau-compile --null "$f"; done
          /tmp/luau/luau tests/store_test.luau
